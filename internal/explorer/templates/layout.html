{{define "layout.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Olsen Photo Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #e8e8e8;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Toolbar */
        .toolbar {
            background: #0a0a0a;
            border-bottom: 1px solid #2a2a2a;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .toolbar-logo {
            font-size: 1.125rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: #e8e8e8;
            text-decoration: none;
        }

        .toolbar-logo:hover {
            color: #fff;
        }

        .view-mode-switcher {
            display: flex;
            gap: 0.25rem;
            background: #1a1a1a;
            border-radius: 6px;
            padding: 0.25rem;
        }

        .view-mode-btn {
            padding: 0.375rem 0.75rem;
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .view-mode-btn:hover {
            background: #2a2a2a;
            color: #e8e8e8;
        }

        .view-mode-btn.active {
            background: #0a84ff;
            color: #fff;
        }

        .toolbar-spacer {
            flex: 1;
        }

        .sort-dropdown {
            padding: 0.5rem 0.75rem;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #e8e8e8;
            font-size: 0.8125rem;
            cursor: pointer;
        }

        /* Main container */
        main {
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* Grid layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid #2a2a2a;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #0a84ff;
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.15);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 0.875rem;
            font-size: 0.8125rem;
            color: #888;
        }

        .card-info > div:first-child {
            color: #e8e8e8;
            margin-bottom: 0.25rem;
        }

        /* Links */
        a {
            color: #0a84ff;
            text-decoration: none;
            transition: color 0.15s;
        }
        a:hover { color: #409cff; }

        h2 {
            margin-bottom: 1rem;
            font-weight: 500;
            color: #e8e8e8;
        }

        /* Stats grid (for home page) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: #1a1a1a;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: #e8e8e8;
        }

        .stat-label {
            color: #888;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    {{template "content" .}}
</body>
</html>
{{end}}
