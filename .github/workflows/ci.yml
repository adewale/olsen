name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        check-latest: true

    - name: Get dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run gofmt
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "The following files are not formatted:"
          gofmt -l .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.5.0

    - name: Run tests (full suite with race detector)
      run: make test-ci

    # The normal suite replays the seed corpus; this bounded run also lets the
    # coverage-guided engine discover and minimise new ParsePath inputs.
    - name: Run bounded parser fuzzing
      run: make test-fuzz FUZZTIME=10s

    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    - name: Build (without RAW support)
      run: make build

    # Smoke test: the binary must open a database and answer a query, not
    # just print --help. A version/--help check passed while the shipped
    # binary could not open any database (CGO disabled for go-sqlite3).
    - name: Smoke-test the binary (index a fixture, query the database)
      run: |
        set -euo pipefail
        ./bin/olsen version
        ./bin/olsen --help > /dev/null
        db="$RUNNER_TEMP/smoke.db"
        ./bin/olsen index testdata/photos --db "$db"
        ./bin/olsen verify --db "$db"
        ./bin/olsen stats --db "$db" | tee "$RUNNER_TEMP/stats.txt"
        grep -qx 'Total photos: 4' "$RUNNER_TEMP/stats.txt"

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        check-latest: true

    - name: Build (without RAW support)
      run: make build

    - name: Test binary
      run: |
        ./bin/olsen version
        ./bin/olsen --help

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: olsen-${{ matrix.os }}
        path: bin/olsen
        retention-days: 7

  build-raw:
    name: Build with RAW support
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        check-latest: true

    - name: Install LibRaw
      run: sudo apt-get update && sudo apt-get install -y libraw-dev pkg-config

    - name: Build with seppedelanghe/go-libraw
      run: make build-seppedelanghe

    - name: Build with inokone/golibraw
      run: make build-golibraw

    # The LibRaw-tagged tests (buffer-overflow regressions, Leica Monochrom,
    # decode validation, binding differential) are never built by
    # `go test ./...`, and two of them had stopped compiling unnoticed.
    # Compile and vet them for both bindings.
    - name: Compile LibRaw-tagged tests
      run: make vet-raw
